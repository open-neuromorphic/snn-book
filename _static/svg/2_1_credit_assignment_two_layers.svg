<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"
      markerUnits="userSpaceOnUse">
      <polygon points="0,0 11,4.5 0,9" fill="#3f5787" />
    </marker>
    <marker id="ah-red" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"
      markerUnits="userSpaceOnUse">
      <polygon points="0,0 11,4.5 0,9" fill="#c0392b" />
    </marker>
  </defs>

  <style><![CDATA[
    text { font-family: system-ui, -apple-system, sans-serif; }
    .val { font-size: 20px; fill: #3f5787; font-weight: 600; }
    .lbl { font-size: 13px; fill: #8e9bae; }
    .err { fill: #c0392b; }
    .feedback { stroke-dasharray: 6 3; }
    .q { font-size: 24px; fill: #c0392b; font-weight: 700; }
  ]]></style>

  <!-- Input arrow -->
  <line x1="20" y1="120" x2="85" y2="120" stroke="#3f5787" stroke-width="2" marker-end="url(#ah)" />
  <text x="52" y="103" text-anchor="middle" class="val">1</text>
  <text x="52" y="147" text-anchor="middle" class="lbl">input</text>

  <!-- Linear layer 1 -->
  <rect x="90" y="78" width="110" height="84" rx="8" fill="#d2dbed" stroke="#3f5787" stroke-width="2" />
  <text x="145" y="108" text-anchor="middle" font-size="20" fill="#6b7fa3"
    font-family="system-ui, -apple-system, sans-serif">Linear</text>
  <text x="145" y="131" text-anchor="middle" class="val">w&#x2081; = 2</text>

  <!-- Arrow L1 → L2 -->
  <line x1="200" y1="120" x2="255" y2="120" stroke="#3f5787" stroke-width="2" marker-end="url(#ah)" />
  <text x="227" y="103" text-anchor="middle" class="val">2</text>

  <!-- Linear layer 2 -->
  <rect x="260" y="78" width="110" height="84" rx="8" fill="#d2dbed" stroke="#3f5787" stroke-width="2" />
  <text x="315" y="108" text-anchor="middle" font-size="20" fill="#6b7fa3"
    font-family="system-ui, -apple-system, sans-serif">Linear</text>
  <text x="315" y="131" text-anchor="middle" class="val">w&#x2082; = 2</text>

  <!-- Output arrow -->
  <line x1="370" y1="120" x2="435" y2="120" stroke="#3f5787" stroke-width="2" marker-end="url(#ah)" />
  <text x="402" y="103" text-anchor="middle" class="val">4</text>
  <text x="402" y="147" text-anchor="middle" class="lbl">output</text>

  <!-- Comparison node -->
  <circle cx="462" cy="120" r="22" fill="#fff" stroke="#3f5787" stroke-width="2" />
  <text x="462" y="128" text-anchor="middle" font-size="26" fill="#3f5787" font-weight="600"
    font-family="system-ui, -apple-system, sans-serif">&#x2212;</text>

  <!-- Goal arrow from below -->
  <line x1="462" y1="240" x2="462" y2="142" stroke="#3f5787" stroke-width="2" marker-end="url(#ah)" />
  <text x="484" y="195" text-anchor="start" class="val">2</text>
  <text x="484" y="212" text-anchor="start" class="lbl">goal</text>

  <!-- Error straight arrow -->
  <line x1="484" y1="120" x2="555" y2="120" stroke="#c0392b" stroke-width="2"
    marker-end="url(#ah-red)" />
  <text x="520" y="103" text-anchor="middle" class="val err">-2</text>
  <text x="520" y="147" text-anchor="middle" class="lbl err">error</text>

  <!-- Feedback to Layer 2 (dashed, with ?) -->
  <path d="M 555,120 Q 570,120 570,105 L 570,61 Q 570,48 557,48 L 328,48 Q 315,48 315,61 L 315,78"
    stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#ah-red)" class="feedback" />
  <text x="445" y="45" text-anchor="middle" class="q">?</text>

  <!-- Feedback to Layer 1 (dashed, with ?) -->
  <path d="M 555,120 L 585,120 Q 595,120 595,105 L 595,35 Q 595,22 582,22 L 158,22 Q 145,22 145,35 L 145,78"
    stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#ah-red)" class="feedback" />
  <text x="370" y="19" text-anchor="middle" class="q">?</text>
</svg>
