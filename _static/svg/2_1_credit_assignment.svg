<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 250" shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"
      markerUnits="userSpaceOnUse">
      <polygon points="0,0 11,4.5 0,9" fill="#3f5787" />
    </marker>
    <marker id="ah-red" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"
      markerUnits="userSpaceOnUse">
      <polygon points="0,0 11,4.5 0,9" fill="#c0392b" />
    </marker>
  </defs>

  <style><![CDATA[
    :root { --cycle: 15s; }
    text { font-family: system-ui, -apple-system, sans-serif; }
    .val { font-size: 20px; fill: #3f5787; font-weight: 600; }
    .lbl { font-size: 13px; fill: #8e9bae; }
    .err { fill: #c0392b; }

    /* input: fade in at 12.5%–18.75% */
    .anim-input-val { opacity: 0; animation: fade-in-input var(--cycle) ease infinite; }
    @keyframes fade-in-input {
      0%, 12.5%      { opacity: 0; }
      18.75%, 93.75% { opacity: 1; }
      100%           { opacity: 0; }
    }

    /* output arrow & label: fade in at 25%–31.25% */
    .anim-output-val { opacity: 0; animation: fade-in-output var(--cycle) ease infinite; }
    @keyframes fade-in-output {
      0%, 25%        { opacity: 0; }
      31.25%, 93.75% { opacity: 1; }
      100%           { opacity: 0; }
    }

    /* goal & comparison node: fade in at 37.5%–43.75% */
    .anim-goal { opacity: 0; animation: fade-in-goal var(--cycle) ease infinite; }
    @keyframes fade-in-goal {
      0%, 37.5%      { opacity: 0; }
      43.75%, 93.75% { opacity: 1; }
      100%           { opacity: 0; }
    }

    /* error straight arrow: fade in at 50%–56.25%, fade out at 75%–81.25% */
    .anim-error { opacity: 0; animation: fade-in-error var(--cycle) ease infinite; }
    @keyframes fade-in-error {
      0%, 50%        { opacity: 0; }
      56.25%, 75%    { opacity: 1; }
      81.25%         { opacity: 0; }
      100%           { opacity: 0; }
    }

    /* error feedback arrow: fade in at 56.25%–62.5%, fade out at 75%–81.25% */
    .anim-error-fb { opacity: 0; animation: fade-in-error-fb var(--cycle) ease infinite; }
    @keyframes fade-in-error-fb {
      0%, 56.25%     { opacity: 0; }
      62.5%, 75%     { opacity: 1; }
      81.25%         { opacity: 0; }
      100%           { opacity: 0; }
    }

    /* weight: crossfade at 62.5%–68.75% */
    .anim-weight-old { animation: weight-old var(--cycle) ease infinite; }
    @keyframes weight-old {
      0%, 62.5%      { opacity: 1; }
      68.75%, 93.75% { opacity: 0; }
      100%           { opacity: 1; }
    }
    .anim-weight-new { opacity: 0; animation: weight-new var(--cycle) ease infinite; }
    @keyframes weight-new {
      0%, 62.5%      { opacity: 0; }
      68.75%, 93.75% { opacity: 1; }
      100%           { opacity: 0; }
    }

    /* output value "2": visible 31.25%–75%, fades out at 81.25% */
    .anim-output-val-old { opacity: 0; animation: output-val-old var(--cycle) ease infinite; }
    @keyframes output-val-old {
      0%, 25%        { opacity: 0; }
      31.25%, 75%    { opacity: 1; }
      81.25%         { opacity: 0; }
      100%           { opacity: 0; }
    }

    /* corrected output "1": fade in at 75%–81.25% */
    .anim-output-val-corrected { opacity: 0; animation: val-corrected var(--cycle) ease infinite; }
    @keyframes val-corrected {
      0%, 75%        { opacity: 0; }
      81.25%, 93.75% { opacity: 1; }
      100%           { opacity: 0; }
    }

    /* minus sign: visible 43.75%–75%, fades out at 81.25% */
    .anim-minus { opacity: 0; animation: fade-minus var(--cycle) ease infinite; }
    @keyframes fade-minus {
      0%, 37.5%      { opacity: 0; }
      43.75%, 75%    { opacity: 1; }
      81.25%         { opacity: 0; }
      100%           { opacity: 0; }
    }

    /* equals sign: fade in at 81.25%–87.5% */
    .anim-equals { opacity: 0; animation: fade-equals var(--cycle) ease infinite; }
    @keyframes fade-equals {
      0%, 81.25%     { opacity: 0; }
      87.5%, 93.75%  { opacity: 1; }
      100%           { opacity: 0; }
    }
  ]]></style>

  <!-- Input arrow -->
  <line x1="30" y1="110" x2="150" y2="110" stroke="#3f5787" stroke-width="2" marker-end="url(#ah)" />
  <text x="90" y="93" text-anchor="middle" class="val anim-input-val">1</text>
  <text x="90" y="137" text-anchor="middle" class="lbl anim-input-val">input</text>

  <!-- Linear layer box -->
  <rect x="156" y="68" width="144" height="84" rx="8" fill="#d2dbed" stroke="#3f5787"
    stroke-width="2" />
  <text x="228" y="101" text-anchor="middle" font-size="20" fill="#6b7fa3"
    font-family="system-ui, -apple-system, sans-serif">Linear</text>
  <text x="228" y="124" text-anchor="middle" class="val anim-weight-old">w = 2</text>
  <text x="228" y="124" text-anchor="middle" class="val err anim-weight-new">w = 1</text>

  <!-- Output arrow -->
  <line x1="300" y1="110" x2="410" y2="110" stroke="#3f5787" stroke-width="2"
    class="anim-output-val" marker-end="url(#ah)" />
  <text x="355" y="93" text-anchor="middle" class="val anim-output-val-old">2</text>
  <text x="355" y="137" text-anchor="middle" class="lbl anim-output-val">output</text>
  <text x="355" y="93" text-anchor="middle" class="val err anim-output-val-corrected">1</text>

  <!-- Comparison node -->
  <circle cx="435" cy="110" r="25" fill="#fff" stroke="#3f5787" stroke-width="2" class="anim-goal" />
  <text x="435" y="118" text-anchor="middle" font-size="26" fill="#3f5787" font-weight="600"
    font-family="system-ui, -apple-system, sans-serif" class="anim-minus">&#x2212;</text>
  <text x="435" y="118" text-anchor="middle" font-size="26" fill="#c0392b" font-weight="600"
    font-family="system-ui, -apple-system, sans-serif" class="anim-equals">=</text>

  <!-- Goal arrow from below -->
  <line x1="435" y1="222" x2="435" y2="134" stroke="#3f5787" stroke-width="2" marker-end="url(#ah)"
    class="anim-goal" />
  <text x="457" y="185" text-anchor="start" class="val anim-goal">1</text>
  <text x="457" y="202" text-anchor="start" class="lbl anim-goal">goal</text>

  <!-- Error straight arrow -->
  <line x1="460" y1="110" x2="530" y2="110" stroke="#c0392b" stroke-width="2"
    marker-end="url(#ah-red)" class="anim-error" />
  <text x="495" y="93" text-anchor="middle" class="val err anim-error">-1</text>
  <text x="495" y="137" text-anchor="middle" class="lbl err anim-error">error</text>

  <!-- Error feedback arrow (curves above, back into linear layer) -->
  <path
    d="M 530,110 Q 545,110 545,95 L 545,50 Q 545,35 530,35 L 248,35 Q 228,35 228,50 L 228,68"
    stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#ah-red)" class="anim-error-fb" />
</svg>