<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">How an analog neuromorphic substrate computes</title>
  <desc id="desc">Three physical synapses convert input voltages into currents. The currents converge and sum on one shared wire by Kirchhoff's current law, then charge a membrane capacitor in an analog neuron. Device mismatch and electrical noise perturb those physical quantities directly.</desc>

  <defs>
    <linearGradient id="busGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdf0e4" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#f6ad55" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#fdf0e4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neuronFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbf9"/>
      <stop offset="1" stop-color="#e6f4ec"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1a202c" flood-opacity="0.10"/>
    </filter>
    <filter id="nodeGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dd6b20"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f855a"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c05621"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #2d3748; }
      .stage { font-size: 14px; font-weight: 700; letter-spacing: 1.65px; }
      .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.25px; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .equation { font-size: 19px; font-weight: 700; }
      .hairline { stroke: #cbd5e0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>

  <!-- Stage headings -->
  <g>
    <circle cx="50" cy="48" r="15" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="50" y="53" text-anchor="middle" class="small" font-weight="700" fill="#2b6cb0">1</text>
    <text x="77" y="53" class="stage" fill="#2b6cb0">PHYSICAL SYNAPSES</text>
    <line x1="40" y1="76" x2="430" y2="76" stroke="#90cdf4" stroke-width="2"/>
    <g transform="translate(258,30)">
      <rect x="0" y="0" width="58" height="27" rx="13.5" fill="#f7fafc" stroke="#cbd5e0"/>
      <text x="29" y="18" text-anchor="middle" class="small">V</text>
      <rect x="65" y="0" width="58" height="27" rx="13.5" fill="#fdf0e4" stroke="#f6ad55"/>
      <text x="94" y="18" text-anchor="middle" class="small" fill="#c05621">I</text>
      <rect x="130" y="0" width="58" height="27" rx="13.5" fill="#e6f4ec" stroke="#68d391"/>
      <text x="159" y="18" text-anchor="middle" class="small" fill="#276749">Q</text>
    </g>

    <circle cx="476" cy="48" r="15" fill="#fdf0e4" stroke="#dd6b20" stroke-width="1.5"/>
    <text x="476" y="53" text-anchor="middle" class="small" font-weight="700" fill="#c05621">2</text>
    <text x="503" y="53" class="stage" fill="#c05621">WIRE SUM</text>
    <line x1="466" y1="76" x2="712" y2="76" stroke="#f6ad55" stroke-width="2"/>

    <circle cx="758" cy="48" r="15" fill="#e6f4ec" stroke="#2f855a" stroke-width="1.5"/>
    <text x="758" y="53" text-anchor="middle" class="small" font-weight="700" fill="#276749">3</text>
    <text x="785" y="53" class="stage" fill="#276749">ANALOG NEURON</text>
    <line x1="748" y1="76" x2="1160" y2="76" stroke="#68d391" stroke-width="2"/>
  </g>

  <!-- Synaptic inputs and physical conductances -->
  <g filter="url(#softShadow)">
    <rect x="132" y="108" width="284" height="96" rx="14" fill="#f8fbff" stroke="#2b6cb0" stroke-width="1.6"/>
    <rect x="132" y="253" width="284" height="96" rx="14" fill="#f8fbff" stroke="#2b6cb0" stroke-width="1.6"/>
    <rect x="132" y="398" width="284" height="96" rx="14" fill="#f8fbff" stroke="#2b6cb0" stroke-width="1.6"/>
  </g>

  <!-- Input waveforms -->
  <g>
    <rect x="40" y="121" width="66" height="70" rx="13" fill="#e8f1fb" stroke="#90cdf4"/>
    <path d="M51 166 H63 V141 H72 V166 H94" fill="none" stroke="#2b6cb0" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="73" y="183" text-anchor="middle" class="small" fill="#4a5568">V₁(t)</text>
    <line x1="106" y1="156" x2="130" y2="156" stroke="#2b6cb0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

    <rect x="40" y="266" width="66" height="70" rx="13" fill="#e8f1fb" stroke="#90cdf4"/>
    <path d="M51 311 H59 V286 H68 V311 H78 V286 H87 V311 H95" fill="none" stroke="#2b6cb0" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="73" y="328" text-anchor="middle" class="small" fill="#4a5568">V₂(t)</text>
    <line x1="106" y1="301" x2="130" y2="301" stroke="#2b6cb0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

    <rect x="40" y="411" width="66" height="70" rx="13" fill="#e8f1fb" stroke="#90cdf4"/>
    <path d="M51 456 H68 V431 H77 V456 H95" fill="none" stroke="#2b6cb0" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="73" y="473" text-anchor="middle" class="small" fill="#4a5568">V₃(t)</text>
    <line x1="106" y1="446" x2="130" y2="446" stroke="#2b6cb0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Synapse details -->
  <g>
    <circle cx="166" cy="137" r="11" fill="#2b6cb0"/>
    <text x="166" y="142" text-anchor="middle" class="small" font-weight="700" fill="#ffffff">1</text>
    <text x="188" y="142" class="kicker" fill="#2b6cb0">SYNAPSE</text>
    <text x="162" y="173" class="label">conductance  g₁ + δg₁</text>
    <text x="391" y="173" text-anchor="end" class="body" font-weight="700" fill="#c05621">I₁</text>
    <path d="M359 120 l12 0 l-6 9 z" fill="#f6ad55"/>

    <circle cx="166" cy="282" r="11" fill="#2b6cb0"/>
    <text x="166" y="287" text-anchor="middle" class="small" font-weight="700" fill="#ffffff">2</text>
    <text x="188" y="287" class="kicker" fill="#2b6cb0">SYNAPSE</text>
    <text x="162" y="318" class="label">conductance  g₂ + δg₂</text>
    <text x="391" y="318" text-anchor="end" class="body" font-weight="700" fill="#c05621">I₂</text>
    <path d="M340 265 l12 0 l-6 9 z" fill="#f6ad55"/>

    <circle cx="166" cy="427" r="11" fill="#2b6cb0"/>
    <text x="166" y="432" text-anchor="middle" class="small" font-weight="700" fill="#ffffff">3</text>
    <text x="188" y="432" class="kicker" fill="#2b6cb0">SYNAPSE</text>
    <text x="162" y="463" class="label">conductance  g₃ + δg₃</text>
    <text x="391" y="463" text-anchor="end" class="body" font-weight="700" fill="#c05621">I₃</text>
    <path d="M374 410 l12 0 l-6 9 z" fill="#f6ad55"/>
  </g>

  <!-- Physical currents converge on one conductor -->
  <rect x="421" y="95" width="298" height="418" rx="28" fill="url(#busGlow)"/>
  <g fill="none" stroke="#dd6b20" stroke-linecap="round">
    <path d="M416 156 H557" stroke-width="5.2" marker-end="url(#arrowOrange)"/>
    <path d="M416 301 H557" stroke-width="3.2" marker-end="url(#arrowOrange)"/>
    <path d="M416 446 H557" stroke-width="4.2" marker-end="url(#arrowOrange)"/>
    <path d="M570 151 V451" stroke-width="8"/>
    <path d="M570 301 H754" stroke-width="7" marker-end="url(#arrowOrange)"/>
  </g>
  <g fill="#ffffff" stroke="#dd6b20" stroke-width="3">
    <circle cx="570" cy="156" r="8"/>
    <circle cx="570" cy="446" r="8"/>
  </g>
  <circle cx="570" cy="301" r="18" fill="#f6ad55" opacity="0.25" filter="url(#nodeGlow)"/>
  <circle cx="570" cy="301" r="9" fill="#dd6b20" stroke="#ffffff" stroke-width="3"/>
  <g>
    <rect x="488" y="100" width="164" height="35" rx="17.5" fill="#ffffff" stroke="#f6ad55"/>
    <text x="570" y="123" text-anchor="middle" class="small" font-weight="700" fill="#c05621">SHARED CONDUCTOR</text>
    <text x="590" y="260" class="equation" fill="#c05621">IΣ = I₁ + I₂ + I₃</text>
    <rect x="592" y="327" width="139" height="29" rx="14.5" fill="#fdf0e4" stroke="#f6ad55"/>
    <text x="661.5" y="347" text-anchor="middle" class="small" font-weight="700" fill="#c05621">NO ADDER CIRCUIT</text>
    <text x="592" y="379" class="body" fill="#4a5568">Kirchhoff’s law</text>
    <text x="592" y="400" class="body" fill="#4a5568">does the addition</text>
  </g>

  <!-- Analog neuron -->
  <g filter="url(#softShadow)">
    <rect x="758" y="106" width="402" height="407" rx="24" fill="url(#neuronFill)" stroke="#2f855a" stroke-width="1.8"/>
  </g>
  <text x="786" y="139" class="kicker" fill="#276749">MEMBRANE CIRCUIT</text>

  <!-- Membrane node and capacitor -->
  <g fill="none" stroke="#2f855a" stroke-linecap="round" stroke-linejoin="round">
    <line x1="758" y1="301" x2="831" y2="301" stroke-width="4"/>
    <circle cx="831" cy="301" r="7" fill="#2f855a" stroke="#ffffff" stroke-width="2"/>
    <line x1="831" y1="301" x2="831" y2="360" stroke-width="3"/>
    <line x1="793" y1="360" x2="869" y2="360" stroke-width="4"/>
    <line x1="793" y1="379" x2="869" y2="379" stroke-width="4"/>
    <line x1="831" y1="379" x2="831" y2="429" stroke-width="3"/>
    <line x1="811" y1="429" x2="851" y2="429" stroke-width="3"/>
    <line x1="817" y1="439" x2="845" y2="439" stroke-width="3"/>
    <line x1="824" y1="449" x2="838" y2="449" stroke-width="3"/>
    <path d="M831 301 H906 V326 l-10 9 l20 14 l-20 14 l20 14 l-10 9 V429" stroke-width="2.5"/>
    <line x1="886" y1="429" x2="926" y2="429" stroke-width="3"/>
    <line x1="892" y1="439" x2="920" y2="439" stroke-width="3"/>
    <line x1="899" y1="449" x2="913" y2="449" stroke-width="3"/>
  </g>
  <text x="842" y="290" class="label" fill="#276749">V<tspan baseline-shift="sub" font-size="11px">m</tspan></text>
  <text x="879" y="375" class="body" font-weight="700" fill="#276749">C<tspan baseline-shift="sub" font-size="10px">m</tspan></text>
  <text x="924" y="359" class="small" fill="#4a5568">leak</text>
  <text x="799" y="478" class="small" fill="#4a5568">current becomes stored charge</text>

  <!-- Membrane voltage trace -->
  <g>
    <rect x="949" y="159" width="181" height="193" rx="14" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.4"/>
    <text x="966" y="184" class="small" font-weight="700" fill="#276749">MEMBRANE VOLTAGE</text>
    <line x1="969" y1="218" x2="1112" y2="218" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="1109" y="210" text-anchor="end" class="small" fill="#c05621">threshold</text>
    <line x1="969" y1="316" x2="1112" y2="316" class="hairline"/>
    <path d="M969 308 C988 305 995 291 1007 270 C1017 252 1024 229 1028 218 L1031 308 C1055 303 1066 278 1078 250 C1085 235 1090 223 1092 218 L1095 308 L1112 305" fill="none" stroke="#2f855a" stroke-width="3.2"/>
    <circle cx="1028" cy="218" r="4" fill="#dd6b20"/>
    <circle cx="1092" cy="218" r="4" fill="#dd6b20"/>
    <path d="M1130 218 H1174" fill="none" stroke="#2f855a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="1158" y="204" text-anchor="end" class="small" font-weight="700" fill="#276749">spike out</text>
  </g>
  <path d="M906 301 C926 301 927 255 949 255" fill="none" stroke="#2f855a" stroke-width="1.8" stroke-dasharray="4 5"/>

  <!-- Compact governing relation -->
  <rect x="940" y="385" width="194" height="82" rx="13" fill="#ffffff" stroke="#9ae6b4"/>
  <text x="1037" y="409" text-anchor="middle" class="small" font-weight="700" fill="#276749">DEVICE PHYSICS INTEGRATES</text>
  <text x="1037" y="434" text-anchor="middle" font-size="17px" font-weight="700" fill="#276749">C<tspan baseline-shift="sub" font-size="11px">m</tspan><tspan baseline-shift="baseline"> · dV</tspan><tspan baseline-shift="sub" font-size="11px">m</tspan><tspan baseline-shift="baseline">/dt</tspan></text>
  <text x="1037" y="457" text-anchor="middle" font-size="15px" font-weight="700" fill="#276749">= IΣ − I<tspan baseline-shift="sub" font-size="10px">leak</tspan><tspan baseline-shift="baseline"> + η(t)</tspan></text>

  <!-- Physical imperfections enter the same signals -->
  <g>
    <path d="M288 568 C288 542 278 524 269 496" fill="none" stroke="#c05621" stroke-width="1.7" stroke-dasharray="4 5" marker-end="url(#arrowMuted)"/>
    <path d="M824 568 C824 542 831 525 831 506" fill="none" stroke="#c05621" stroke-width="1.7" stroke-dasharray="4 5" marker-end="url(#arrowMuted)"/>
    <rect x="40" y="554" width="1120" height="68" rx="18" fill="#fffaf5" stroke="#f6ad55" stroke-width="1.4"/>
    <circle cx="76" cy="588" r="18" fill="#fdf0e4" stroke="#dd6b20" stroke-width="1.4"/>
    <path d="M76 576 V590 M76 597.5 V598" fill="none" stroke="#c05621" stroke-width="3" stroke-linecap="round"/>
    <text x="108" y="582" class="kicker" fill="#c05621">PHYSICAL VARIATION BECOMES NUMERICAL VARIATION</text>
    <text x="108" y="605" class="body" fill="#4a5568">It enters the computation at the devices and wires themselves.</text>

    <rect x="583" y="570" width="251" height="36" rx="18" fill="#ffffff" stroke="#f6ad55"/>
    <text x="605" y="593" class="body" font-weight="700" fill="#c05621">mismatch</text>
    <text x="686" y="593" class="body" fill="#4a5568">g<tspan baseline-shift="sub" font-size="10px">i</tspan><tspan baseline-shift="baseline"> → g</tspan><tspan baseline-shift="sub" font-size="10px">i</tspan><tspan baseline-shift="baseline"> + δg</tspan><tspan baseline-shift="sub" font-size="10px">i</tspan></text>
    <rect x="849" y="570" width="288" height="36" rx="18" fill="#ffffff" stroke="#f6ad55"/>
    <text x="871" y="593" class="body" font-weight="700" fill="#c05621">thermal + shot noise</text>
    <text x="1088" y="593" class="body" fill="#4a5568">η(t)</text>
  </g>
</svg>
