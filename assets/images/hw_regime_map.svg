<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Hardware design regimes by activity sparsity and work per event</title>
  <desc id="desc">A qualitative map showing conventional clocked accelerators in the dense or low-work region, event-driven neuromorphic hardware in the sparse and high-work region, and hybrid event-clocked designs between them. Eight application examples illustrate the regimes, including a dashed arrow from dense to sparsified transformer serving.</desc>

  <defs>
    <clipPath id="plot-clip">
      <rect x="110" y="80" width="840" height="505"/>
    </clipPath>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263445"/>
    </marker>
    <marker id="move-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#237a50"/>
    </marker>
    <style>
      .figure-text { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #263445; }
      .axis { fill: none; stroke: #263445; stroke-width: 2.2; }
      .axis-label { font-size: 21px; font-weight: 500; }
      .region-title { font-size: 24px; font-weight: 500; letter-spacing: 0.15px; }
      .application { font-size: 19px; font-weight: 400; }
      .annotation { font-size: 17.5px; font-style: italic; font-weight: 500; }
      .boundary { fill: none; stroke: #929ca8; stroke-width: 1.8; stroke-dasharray: 7 6; }
      .marker { stroke: #ffffff; stroke-width: 2.5; }
      .clocked { fill: #b45309; }
      .hybrid { fill: #4f46a5; }
      .event { fill: #237a50; }
    </style>
  </defs>

  <rect width="1000" height="680" fill="#ffffff"/>

  <!-- The two diagonal thresholds make the hybrid regime an explicit band. -->
  <g clip-path="url(#plot-clip)">
    <rect x="110" y="80" width="840" height="505" fill="#fbe8d7"/>
    <path d="M 210 80 H 440 L 950 370 V 500 Z" fill="#e8e8f6"/>
    <path d="M 440 80 H 950 V 370 Z" fill="#ddefe5"/>
    <path class="boundary" d="M 210 80 L 950 500"/>
    <path class="boundary" d="M 440 80 L 950 370"/>
  </g>

  <!-- Light top and right edges complete the plot frame without competing with the axes. -->
  <path d="M 110 80 H 950 V 585" fill="none" stroke="#cbd5df" stroke-width="1.2"/>

  <!-- Direct labels remove the need for a legend. -->
  <g class="figure-text">
    <text x="330" y="365" text-anchor="middle" class="region-title clocked">CLOCKED / CONVENTIONAL</text>
    <text x="330" y="391" text-anchor="middle" class="region-title clocked">ACCELERATOR USUALLY WINS</text>

    <text x="500" y="155" text-anchor="middle" class="region-title hybrid">HYBRID</text>
    <text x="500" y="181" text-anchor="middle" class="region-title hybrid">EVENT +</text>
    <text x="500" y="207" text-anchor="middle" class="region-title hybrid">CLOCKED</text>

    <text x="790" y="205" text-anchor="middle" class="region-title event">EVENT-DRIVEN</text>
    <text x="790" y="233" text-anchor="middle" class="region-title event">NEUROMORPHIC GAINS</text>
  </g>

  <!-- Sparsifying one deployed model can move its application point horizontally. -->
  <path d="M 215 112 C 405 37, 710 43, 849 113" fill="none" stroke="#237a50" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round" marker-end="url(#move-arrow)"/>
  <text x="545" y="36" text-anchor="middle" class="figure-text annotation event">sparsifying the model moves the same application across the map</text>

  <!-- Application points and consistently aligned labels. -->
  <g class="figure-text application">
    <!-- Clocked / conventional examples. -->
    <circle cx="205" cy="120" r="8" class="marker clocked"/>
    <text x="228" y="126">dense transformer serving</text>

    <circle cx="190" cy="275" r="8" class="marker clocked"/>
    <text x="214" y="269">still-image classification</text>
    <text x="214" y="291">(no temporal sparsity to skip)</text>

    <circle cx="240" cy="500" r="8" class="marker clocked"/>
    <text x="264" y="477">small dense classifiers, e.g.</text>
    <text x="264" y="499">activity recognition from</text>
    <text x="264" y="521">inertial-sensor features</text>

    <circle cx="862" cy="535" r="8" class="marker clocked"/>
    <text x="838" y="519" text-anchor="end">vibration monitoring,</text>
    <text x="838" y="541" text-anchor="end">rare threshold crossings</text>

    <!-- Hybrid examples. -->
    <circle cx="585" cy="245" r="8" class="marker hybrid"/>
    <text x="561" y="239" text-anchor="end">brain-scale cortical</text>
    <text x="561" y="261" text-anchor="end">simulation</text>

    <circle cx="785" cy="390" r="8" class="marker hybrid"/>
    <text x="809" y="383">always-on</text>
    <text x="809" y="407">keyword spotting</text>

    <!-- Event-driven examples. -->
    <circle cx="860" cy="120" r="8" class="marker event"/>
    <text x="844" y="134" text-anchor="end">sparse or mixture-of-experts</text>
    <text x="844" y="157" text-anchor="end">transformer serving</text>

    <circle cx="870" cy="282" r="8" class="marker event"/>
    <text x="846" y="274" text-anchor="end">event-camera obstacle</text>
    <text x="846" y="298" text-anchor="end">avoidance and tracking</text>
  </g>

  <!-- Directional axes. -->
  <path class="axis" d="M 110 585 H 970" marker-end="url(#axis-arrow)"/>
  <path class="axis" d="M 110 585 V 62" marker-end="url(#axis-arrow)"/>

  <g class="figure-text axis-label">
    <text x="530" y="642" text-anchor="middle">Activity sparsity at the datapath (dense &#8594; sparse)</text>
    <text x="38" y="333" text-anchor="middle" transform="rotate(-90 38 333)">Work triggered per event (low &#8594; high)</text>
  </g>
</svg>
