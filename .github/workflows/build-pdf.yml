name: Build PDF

# Builds the book PDF and uploads it as an artifact. Runs on every push to main
# (the release branch) and on PRs as a build check. The PDF for a run is under
# the run's "Artifacts" section as `snn-book-pdf`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels an in-flight build.
concurrency:
  group: build-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nix gives CI the exact toolchain from flake.nix — the same one
      # `nix develop` provides locally (texlive, inkscape, uv, node). One
      # environment definition for both, so there is nothing to keep in sync.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Caches the /nix/store between runs so the (large) texlive + inkscape
      # closure isn't re-fetched every time. Keyed on the flake lock/inputs.
      # If build time is still a concern, slim `texliveFull` in flake.nix to a
      # custom scheme, or push the closure to a Cachix cache.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G

      # `make pdf` = DYNSIM_STATIC=1 (static plot fallbacks) + the Inkscape
      # DBus/portal env fix + jupyter-book build --pdf. The devShell's shellHook
      # runs `uv sync` first, so Python deps are installed here too.
      - name: Build the book PDF
        run: nix develop --command make pdf

      - name: Verify a PDF was produced
        run: |
          shopt -s nullglob
          pdfs=(_build/exports/*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "::error::No PDF was produced in _build/exports/"
            exit 1
          fi
          ls -lh "${pdfs[@]}"

      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: snn-book-pdf
          path: _build/exports/*.pdf
          if-no-files-found: error
