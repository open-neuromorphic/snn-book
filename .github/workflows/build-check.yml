name: Build Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          apk add --no-cache python3 py3-pip nodejs npm
          pip3 install --break-system-packages -r requirements.txt
      
      - name: Build PDF
        run: jupyter-book build --pdf
      
      - name: Verify PDF was created
        run: |
          if [ -f "_build/exports/"*.pdf ]; then
            echo "✅ PDF built successfully"
            ls -lh _build/exports/
          else
            echo "❌ PDF build failed - no PDF found"
            exit 1
          fi
