myst: v1
title: Plain LaTeX Book
description: A plain latex book theme
version: '1.0.0'
authors:
  - name: Rowan Cockett
    website: https://row1.ca
    affiliations:
      - Curvenote
      - Executable Books
license: CC-BY-4.0
thumbnail: ./thumbnail.png
tags:
  - book
# parts:
#   - id: acknowledgments
#     description: >
#       Add an acknowledgments to your book
doc:
  - id: title
    required: true
  - id: subtitle
  - id: authors
    required: true
  # - id: keywords
  #   description: |
  #     Include a list of keywords after the abstract (minimum 3)
  - id: bibliography
options:
  - id: book_version
    title: Book version
    type: string
    description: >
      Release version of the book, printed under the title. Anything below 1.0
      signals to the reader that the book is not finished. Set in myst.yml under
      the pdf export; _plugins/draft-notice.mjs reads the same key so the
      per-chapter banners stay in sync.
files:
  - template.tex
packages:
  - babel
  - caption
  - enumitem
  - fontenc
  - framed
  - geometry
  - graphicx
  - hyperref
  - inputenc
  - lmodern
  - natbib
  - xcolor
  - changepage
  - amssymb
  - fancyvrb
  - titlesec
