# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: 04162ef5-fe1c-4cf7-99bf-a0d930bc11c2
  title: Practical Spiking Neural Networks
  description: A hands-on guide to building and deploying spiking neural networks using Python
  keywords:
    - spiking neural networks
    - neuromorphic computing
    - Python
    - machine learning
    - deep learning
  github: https://github.com/open-neuromorphic/snn-book
  license: CC-BY-4.0
  plugins:
    - _plugins/dynamical-systems.mjs
  toc:
    - file: README.md
      numbering: false
    - file: topics/0_intro.md
      children:
        - file: topics/0_reader.md
        - file: topics/0_why_snns.md
    - file: topics/1_foundations.md
    - file: topics/2_training.md
    - file: topics/3_hardware.md
    - file: glossary.md
      numbering: false
    - file: contributors.md
      children:
      - file: dev/simulation.md
      - file: dev/widget-dynsim.md
      numbering: false
    - file: reviewers.md
      numbering: false
    - file: visualization.md
      numbering: false
  bibliography:
    - references.bib
  numbering:
    title:
      enabled: true
      continue: true
    headings: true
  exports:
    - format: pdf
      template: arxiv_nips
      article_type: book
      articles:
        - topics/0_intro.md
        - topics/0_reader.md
        - topics/0_why_snns.md
        - topics/1_foundations.md
        - topics/2_training.md
        - topics/3_hardware.md

parse:
  myst_enable_extensions:
    - amsmath
site:
  template: book-theme
  options:
    folders: true
    logo_text: Practical Spiking Neural Networks
    favicon: images/icon.ico
    logo: images/icon.svg
