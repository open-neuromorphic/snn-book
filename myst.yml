  exports:
    - format: pdf
      output: snnbook.pdf
      template: templates/plain_latex_book
      article_type: book
      # Single source of truth for the release. Printed under the title on the
      # PDF cover and read by _plugins/draft-notice.mjs for the per-chapter
      # banners on both web and print. Bump this on every release.
      book_version: '0.8'
      # level sets the LaTeX sectioning depth per file so the book nests by TOC
      # depth: 0 = \chapter (top-level topics), 1 = \section (their pages),
      # 2 = \subsection (nested pages). Without this MyST defaults every file to
      # \section, collapsing the whole book under one unnumbered chapter "0".
